<!DOCTYPE html>
<html lang="fr">

<head>
   <script src="/socket.io/socket.io.js"></script>
   <script src="file/scriptClient.js" defer></script>
   <script src="file/hexagoneScript.js" defer></script>
   <script src="https://d3js.org/d3.v7.min.js"></script>
   <link rel="stylesheet" type="text/css" href="file/clientstyles.css">

   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
   <title>Hex</title>

</head>

<body>
   <header>
      <div id="playerList"></div>
      <h1 id="gameName">Hex</h1>
      <div id="joinDiv">
         <input type="text" id="nick" maxlength="24">
         <button id="joinBut" onclick="join()">join party!</button>
      </div>
      <div id="inParty">
         <div id="playerName"></div>
         <button id="leaveBut" onclick="leave()">leave :(</button>
         <button id="resetButton" onclick="resetGame()">Reset</button>
      </div>
   </header>
   <hr/>

   <div id="spectatorButtons">
      <button id="bStart" onclick="spectStart()">start</button>
      <button id="bBack" onclick="spectStepBack()">back</button>
      <button id="bForward" onclick="spectStepForward()">forward</button>
      <button id="bLive" onclick="spectLive()">follow game</button>
   </div>
   <div id="whosTurn"></div>
   <div id="winnerMessage"></div>
   <div id="field"></div>

   <div id="chat">
      <input type="text" id="inputMes">
      <button id="sendMes" onclick="send()">Send!</button>
      <!-- <div><textarea id="chat" rows="30" cols="40" style="resize:none" readonly></textarea></div> -->
      <div id="chatbox">

         <!--* these are example messages for testing css -->
         <div class="chatMessage userMsg">
            <span class="chatUsername">Fish:</span> <div id="m1">Hello opiwef fjjj we  eee there sir bwabwabwa</div>
         </div>
         <div class="chatMessage userMsg dimmedMsg">
            <span class="chatUsername">shark:</span> <div id="m2">Stroke much???</div>
         </div>
      </div>
   </div>
</body>

</html>
